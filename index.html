<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Markdown URL Viewer</title>
    <meta http-equiv="refresh" content="0; url=./viewer.html" />
    <script>
      const target = new URL("./viewer.html", window.location.href);
      target.search = window.location.search;
      target.hash = window.location.hash;
      window.location.replace(target.toString());
    </script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f7f4ed;
        color: #1f1a17;
        font-family: Georgia, "Times New Roman", serif;
      }

      a {
        color: #0d6b5f;
      }
    </style>
  </head>
  <body>
    <p>If you are not redirected automatically, open <a href="./viewer.html">viewer.html</a>.</p>
  </body>
</html>
