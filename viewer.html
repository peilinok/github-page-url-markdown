<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Markdown URL Viewer</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #ffffff;
        --panel: #ffffff;
        --panel-strong: #fafafa;
        --panel-muted: #f5f5f5;
        --text: #111111;
        --muted: #5f5f5f;
        --accent: #111111;
        --accent-strong: #000000;
        --accent-soft: #efefef;
        --border: #e3e3e3;
        --error-bg: #fff7f5;
        --error-text: #9a3412;
        --shadow: 0 12px 32px rgba(0, 0, 0, 0.04);
        --ui-font: "Aptos", "Segoe UI", sans-serif;
        --reading-font: "Iowan Old Style", Georgia, "Times New Roman", serif;
      }

      html {
        height: 100%;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: var(--ui-font);
        color: var(--text);
        background: var(--bg);
      }

      a {
        color: var(--accent-strong);
      }

      button,
      input {
        font: inherit;
      }

      button {
        padding: 0;
        border: 0;
        color: inherit;
        background: none;
        cursor: pointer;
      }

      .shell {
        min-height: 100vh;
        display: grid;
        grid-template-rows: auto auto auto minmax(0, 1fr);
        background: var(--bg);
      }

      .app-toolbar {
        display: grid;
        grid-template-columns: minmax(240px, 320px) minmax(0, 1fr);
        gap: 24px;
        padding: 20px 24px 16px;
        border-bottom: 1px solid var(--border);
        background: var(--panel);
      }

      .app-toolbar__brand,
      .app-toolbar__controls {
        display: grid;
        gap: 12px;
        align-content: start;
      }

      h1 {
        margin: 0;
        font-family: var(--reading-font);
        font-size: clamp(1.6rem, 2.6vw, 2.2rem);
        line-height: 1;
        letter-spacing: -0.04em;
      }

      .intro {
        margin: 0;
        color: var(--muted);
        font-size: 0.95rem;
        line-height: 1.5;
        max-width: 34ch;
      }

      .form {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 12px;
        align-items: center;
      }

      input[type="url"] {
        width: 100%;
        padding: 14px 16px;
        border: 1px solid var(--border);
        border-radius: 12px;
        color: var(--text);
        background: var(--panel);
        min-height: 48px;
      }

      input[type="url"]::placeholder {
        color: #8b8b8b;
      }

      input[type="url"]:focus {
        outline: none;
        border-color: #222222;
        box-shadow: 0 0 0 3px rgba(17, 17, 17, 0.08);
      }

      .primary-button {
        min-height: 48px;
        padding: 0 18px;
        border: 1px solid #111111;
        border-radius: 12px;
        font-weight: 600;
        color: #ffffff;
        background: #111111;
      }

      .primary-button:hover {
        background: #000000;
      }

      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        color: var(--muted);
      }

      .chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 7px 12px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: var(--panel-muted);
        font-size: 0.88rem;
      }

      .status,
      .error {
        margin: 0;
        padding: 12px 24px;
        border-bottom: 1px solid var(--border);
        font-size: 0.92rem;
      }

      .status {
        background: var(--panel-strong);
        color: var(--muted);
      }

      .error {
        display: none;
        background: var(--error-bg);
        color: var(--error-text);
        white-space: pre-wrap;
      }

      .preview {
        min-height: 0;
        overflow: auto;
        background: var(--panel);
      }

      .viewer-layout {
        min-height: 100%;
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        align-items: start;
      }

      .viewer-layout.has-sidebar {
        grid-template-columns: minmax(280px, 320px) minmax(0, 1fr);
      }

      .viewer-layout.has-sidebar.is-sidebar-collapsed {
        grid-template-columns: 72px minmax(0, 1fr);
      }

      .preview-nav {
        position: sticky;
        top: 0;
        align-self: start;
        min-height: 100%;
        padding: 20px 16px 24px 24px;
        border-right: 1px solid var(--border);
        background: var(--panel-strong);
        display: grid;
        gap: 12px;
        align-content: start;
      }

      .preview-nav__header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .preview-nav__title {
        font-size: 0.8rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        font-weight: 700;
      }

      .chrome-toggle,
      .section-toggle {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 36px;
        padding: 0 12px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: #ffffff;
        color: var(--text);
        font-size: 0.9rem;
        font-weight: 600;
      }

      .chrome-toggle:hover,
      .section-toggle:hover {
        background: var(--accent-soft);
      }

      .chrome-toggle__icon,
      .section-toggle__icon {
        font-size: 1rem;
        line-height: 1;
      }

      .preview-nav.is-rail-collapsed {
        padding-inline: 12px;
      }

      .preview-nav.is-rail-collapsed .preview-nav__title,
      .preview-nav.is-rail-collapsed .nav-section {
        display: none;
      }

      .preview-nav.is-rail-collapsed .preview-nav__header {
        justify-content: center;
      }

      .preview-nav.is-rail-collapsed .chrome-toggle {
        width: 48px;
        padding: 0;
      }

      .preview-nav.is-rail-collapsed .chrome-toggle__label {
        display: none;
      }

      .nav-section {
        border: 1px solid var(--border);
        border-radius: 14px;
        background: var(--panel);
        overflow: hidden;
      }

      .nav-section.is-empty {
        display: none;
      }

      .nav-section__header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 14px;
        border-bottom: 1px solid var(--border);
      }

      .nav-section__title {
        margin: 0;
        font-size: 0.85rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-weight: 700;
      }

      .nav-section__body {
        display: grid;
        gap: 14px;
        padding: 14px;
      }

      .nav-section.is-collapsed .nav-section__body {
        display: none;
      }

      .explorer-meta {
        margin: 0;
        color: var(--muted);
        line-height: 1.55;
        font-size: 0.9rem;
      }

      .explorer-meta a {
        color: var(--text);
        text-decoration: none;
        border-bottom: 1px solid #bbbbbb;
      }

      .explorer-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 8px;
      }

      .explorer-item {
        margin: 0;
      }

      .explorer-link {
        width: 100%;
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 10px;
        align-items: center;
        padding: 10px 12px;
        border: 1px solid transparent;
        border-radius: 12px;
        background: var(--panel-muted);
        color: var(--text);
        text-align: left;
        min-height: 0;
      }

      .explorer-link:hover {
        background: #ededed;
      }

      .explorer-link.is-active {
        border-color: #111111;
        background: var(--accent-soft);
      }

      .explorer-kind {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 42px;
        padding: 4px 8px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: #ffffff;
        color: var(--muted);
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .explorer-label {
        min-width: 0;
        overflow-wrap: anywhere;
      }

      .explorer-empty {
        margin: 0;
        color: var(--muted);
        font-size: 0.92rem;
      }

      .preview-layout {
        display: grid;
        grid-template-columns: 1fr;
        min-width: 0;
        min-height: 100%;
        background: var(--panel);
      }

      .toc-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 4px;
      }

      .toc-item {
        margin: 0;
      }

      .toc-link {
        display: block;
        padding: 8px 10px;
        border-radius: 10px;
        color: var(--muted);
        text-decoration: none;
        line-height: 1.35;
        font-size: 0.94rem;
      }

      .toc-link:hover,
      .toc-link.is-active {
        background: var(--accent-soft);
        color: var(--text);
      }

      .toc-link.depth-2 {
        padding-left: 22px;
      }

      .toc-link.depth-3 {
        padding-left: 34px;
      }

      .toc-link.depth-4,
      .toc-link.depth-5,
      .toc-link.depth-6 {
        padding-left: 46px;
      }

      .preview-body {
        min-width: 0;
        padding: 32px clamp(18px, 4vw, 56px) 72px;
      }

      .reading-column {
        width: min(100%, 900px);
        margin: 0 auto;
      }

      .placeholder {
        margin: 0;
        color: var(--muted);
      }

      .markdown-body {
        font-family: var(--reading-font);
        font-size: 1.04rem;
        line-height: 1.82;
        word-break: break-word;
      }

      .markdown-body > * {
        max-width: 72ch;
      }

      .markdown-body > :first-child {
        margin-top: 0;
      }

      .markdown-body > :last-child {
        margin-bottom: 0;
      }

      .markdown-body h1,
      .markdown-body h2,
      .markdown-body h3 {
        line-height: 1.15;
        letter-spacing: -0.02em;
        max-width: 28ch;
      }

      .markdown-body h1 {
        font-size: clamp(2rem, 3vw, 2.8rem);
        margin-bottom: 0.9rem;
      }

      .markdown-body h2 {
        font-size: clamp(1.45rem, 2vw, 1.9rem);
        margin-top: 2.4rem;
      }

      .markdown-body h3 {
        font-size: 1.2rem;
        margin-top: 1.8rem;
      }

      .heading-anchor {
        color: inherit;
        text-decoration: none;
      }

      .heading-anchor:hover {
        color: var(--accent-strong);
        text-decoration: underline;
        text-decoration-thickness: 1px;
        text-underline-offset: 0.15em;
      }

      .markdown-body img {
        max-width: 100%;
      }

      .markdown-body pre {
        max-width: 100%;
        overflow-x: auto;
        padding: 14px 16px;
        border-radius: 14px;
        border: 1px solid var(--border);
        background: #f6f6f6;
      }

      .markdown-body code {
        font-family: "Cascadia Code", Consolas, monospace;
        font-size: 0.94em;
      }

      .markdown-body blockquote {
        margin-left: 0;
        padding-left: 16px;
        border-left: 3px solid #111111;
        color: var(--muted);
      }

      .graphviz-block {
        margin: 24px 0;
        padding: 16px;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: #f7f7f7;
        overflow-x: auto;
        max-width: 100%;
      }

      .graphviz-block svg {
        display: block;
        max-width: 100%;
        height: auto;
      }

      .graphviz-error {
        margin: 24px 0;
        padding: 14px 16px;
        border: 1px solid rgba(138, 51, 24, 0.18);
        border-radius: 16px;
        background: var(--error-bg);
        color: var(--error-text);
      }

      .mermaid-block {
        margin: 24px 0;
        padding: 16px;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: #f7f7f7;
        overflow-x: auto;
        max-width: 100%;
      }

      .mermaid-block svg {
        display: block;
        max-width: 100%;
        height: auto;
      }

      .mermaid-error {
        margin: 24px 0;
        padding: 14px 16px;
        border: 1px solid rgba(138, 51, 24, 0.18);
        border-radius: 16px;
        background: var(--error-bg);
        color: var(--error-text);
      }

      @media (max-width: 920px) {
        .app-toolbar {
          grid-template-columns: 1fr;
          padding: 16px;
        }

        .status,
        .error {
          padding-inline: 16px;
        }

        .viewer-layout.has-sidebar {
          grid-template-columns: 1fr;
        }

        .viewer-layout.has-sidebar.is-sidebar-collapsed {
          grid-template-columns: 1fr;
        }

        .preview-nav,
        .preview-nav.is-rail-collapsed {
          position: static;
          min-height: 0;
          padding: 16px;
          border-right: 0;
          border-bottom: 1px solid var(--border);
        }

        .preview-nav.is-rail-collapsed .preview-nav__title {
          display: inline;
        }

        .preview-nav.is-rail-collapsed .nav-section {
          display: block;
        }

        .preview-layout {
          min-height: 0;
        }
      }

      @media (max-width: 680px) {
        .app-toolbar {
          padding: 16px;
        }

        .form {
          grid-template-columns: 1fr;
        }

        .primary-button {
          width: 100%;
        }

        .preview-body {
          padding: 24px 16px 48px;
        }

        .markdown-body {
          font-size: 1rem;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="app-toolbar">
        <div class="app-toolbar__brand">
          <h1>Markdown URL Viewer</h1>
          <p class="intro">
            Render public Markdown or GitHub directory Markdown in a full-window reading view.
          </p>
        </div>

        <div class="app-toolbar__controls">
          <form id="viewer-form" class="form">
            <input
              id="url-input"
              name="url"
              type="url"
              placeholder="https://example.com/file.md"
              required
            />
            <button type="submit" class="primary-button">Render Preview</button>
          </form>

          <div class="meta">
            <span class="chip">Query param: <code>?url=...</code></span>
            <span class="chip">Target URL must allow browser CORS requests</span>
          </div>
        </div>
      </header>

      <section id="status" class="status">Waiting for a URL.</section>
      <section id="error" class="error"></section>
      <article id="preview" class="preview">
        <p class="placeholder">The rendered Markdown preview will appear here.</p>
      </article>
    </main>

    <script src="./vendor/purify.min.js"></script>
    <script src="./vendor/marked.min.js"></script>
    <script src="./vendor/viz-global.js"></script>
    <script type="module">
      const form = document.getElementById("viewer-form");
      const input = document.getElementById("url-input");
      const statusBox = document.getElementById("status");
      const errorBox = document.getElementById("error");
      const preview = document.getElementById("preview");
      const GITHUB_API_BASE = "https://api.github.com";
      const MARKDOWN_FILE_PATTERN = /\.(md|markdown|mdown|mkdn)$/i;
      let mermaidApiPromise = null;
      let currentTocItems = [];
      let headingSlugCounts = new Map();
      let currentExplorerContext = null;
      let currentHasToc = false;
      let vizInstancePromise = null;
      let currentPreviewBodyHtml = "";
      let currentNavState = {
        railCollapsed: false,
        repositoryCollapsed: false,
        contentsCollapsed: false
      };

      marked.setOptions({
        gfm: true,
        breaks: false
      });

      const renderer = new marked.Renderer();

      function resolveUrl(href, sourceUrl) {
        if (!href) {
          return href;
        }

        try {
          return new URL(href, sourceUrl).toString();
        } catch (_error) {
          return href;
        }
      }

      function escapeAttribute(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/"/g, "&quot;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }

      function slugify(text) {
        const base = String(text || "")
          .toLowerCase()
          .trim()
          .replace(/<[^>]*>/g, "")
          .replace(/[^\w\u4e00-\u9fff\s-]/g, "")
          .replace(/\s+/g, "-")
          .replace(/-+/g, "-")
          .replace(/^-|-$/g, "") || "section";

        const count = headingSlugCounts.get(base) || 0;
        headingSlugCounts.set(base, count + 1);
        return count === 0 ? base : base + "-" + (count + 1);
      }

      function buildTocHtml(items) {
        if (!items.length) {
          return "";
        }

        return items
          .map((item) => {
            return (
              '<li class="toc-item">' +
              '<a class="toc-link depth-' +
              item.depth +
              '" href="#' +
              escapeAttribute(item.id) +
              '">' +
              escapeAttribute(item.text) +
              "</a>" +
              "</li>"
            );
          })
          .join("");
      }

      function getSectionToggleLabel(isCollapsed) {
        return isCollapsed ? "Expand" : "Collapse";
      }

      function getSectionToggleIcon(isCollapsed) {
        return isCollapsed ? "+" : "−";
      }

      function buildNavSectionHtml(title, target, bodyHtml, options) {
        const isCollapsed = Boolean(options && options.collapsed);
        const isEmpty = Boolean(options && options.empty);
        const classes = ["nav-section"];

        if (isCollapsed) {
          classes.push("is-collapsed");
        }

        if (isEmpty) {
          classes.push("is-empty");
        }

        return (
          '<section class="' +
          classes.join(" ") +
          '">' +
          '<div class="nav-section__header">' +
          '<h2 class="nav-section__title">' +
          escapeAttribute(title) +
          "</h2>" +
          '<button type="button" class="section-toggle" data-toggle-target="' +
          escapeAttribute(target) +
          '" aria-expanded="' +
          String(!isCollapsed) +
          '">' +
          '<span class="section-toggle__label">' +
          escapeAttribute(getSectionToggleLabel(isCollapsed)) +
          "</span>" +
          '<span class="section-toggle__icon" aria-hidden="true">' +
          escapeAttribute(getSectionToggleIcon(isCollapsed)) +
          "</span>" +
          "</button>" +
          "</div>" +
          '<div class="nav-section__body">' +
          bodyHtml +
          "</div>" +
          "</section>"
        );
      }

      function isMarkdownFileName(name) {
        return MARKDOWN_FILE_PATTERN.test(String(name || ""));
      }

      function buildGitHubApiUrl(owner, repo, path, ref) {
        const encodedOwner = encodeURIComponent(owner);
        const encodedRepo = encodeURIComponent(repo);
        const encodedPath = path
          ? "/" +
            path
              .split("/")
              .filter(Boolean)
              .map((segment) => encodeURIComponent(segment))
              .join("/")
          : "";

        return (
          GITHUB_API_BASE +
          "/repos/" +
          encodedOwner +
          "/" +
          encodedRepo +
          "/contents" +
          encodedPath +
          "?ref=" +
          encodeURIComponent(ref)
        );
      }

      function buildGitHubTreeUrl(owner, repo, ref, path) {
        const segments = [owner, repo, "tree"]
          .concat(String(ref).split("/").map((segment) => encodeURIComponent(segment)));

        if (path) {
          segments.push.apply(
            segments,
            String(path)
              .split("/")
              .filter(Boolean)
              .map((segment) => encodeURIComponent(segment))
          );
        }

        return "https://github.com/" + segments.join("/");
      }

      function buildGitHubBlobUrl(owner, repo, ref, path) {
        const segments = [owner, repo, "blob"]
          .concat(String(ref).split("/").map((segment) => encodeURIComponent(segment)))
          .concat(
            String(path)
              .split("/")
              .filter(Boolean)
              .map((segment) => encodeURIComponent(segment))
          );

        return "https://github.com/" + segments.join("/");
      }

      function sortGitHubEntries(entries) {
        return entries.slice().sort((left, right) => {
          if (left.type === right.type) {
            return left.name.localeCompare(right.name);
          }

          if (left.type === "dir") {
            return -1;
          }

          if (right.type === "dir") {
            return 1;
          }

          return left.name.localeCompare(right.name);
        });
      }

      function buildExplorerHtml(context) {
        if (!context) {
          return "";
        }

        const itemsHtml = context.entries.length
          ? context.entries
              .map((entry) => {
                const kind = entry.type === "dir" ? "Dir" : isMarkdownFileName(entry.name) ? "MD" : "File";
                const activeClass = context.selectedPath === entry.path ? " is-active" : "";
                const label = entry.type === "dir" ? entry.name + "/" : entry.name;

                return (
                  '<li class="explorer-item">' +
                  '<button type="button" class="explorer-link' +
                  activeClass +
                  '" data-entry-type="' +
                  escapeAttribute(entry.type) +
                  '" data-entry-path="' +
                  escapeAttribute(entry.path) +
                  '">' +
                  '<span class="explorer-kind">' +
                  escapeAttribute(kind) +
                  "</span>" +
                  '<span class="explorer-label">' +
                  escapeAttribute(label) +
                  "</span>" +
                  "</button>" +
                  "</li>"
                );
              })
              .join("")
          : '<li class="explorer-empty">This directory is empty.</li>';

        return buildNavSectionHtml(
          "Repository",
          "repository",
          '<p class="explorer-meta">' +
          '<a href="' +
          escapeAttribute(buildGitHubTreeUrl(context.owner, context.repo, context.ref, context.directoryPath)) +
          '" target="_blank" rel="noreferrer noopener">' +
          escapeAttribute(context.owner + "/" + context.repo) +
          "</a><br />" +
          "branch: " +
          escapeAttribute(context.ref) +
          "<br />" +
          "path: " +
          escapeAttribute("/" + (context.directoryPath || "")) +
          "</p>" +
          '<ol class="explorer-list">' +
          itemsHtml +
          "</ol>",
          {
            collapsed: currentNavState.repositoryCollapsed
          }
        );
      }

      function renderPreviewShell(bodyHtml, tocItems, explorerContext) {
        currentPreviewBodyHtml = bodyHtml;
        const tocHtml = buildTocHtml(tocItems);
        const explorerHtml = buildExplorerHtml(explorerContext);
        currentExplorerContext = explorerContext;
        currentHasToc = tocItems.length > 0;
        const hasSidebar = Boolean(explorerContext || tocItems.length);
        const railClasses = ["preview-nav"];
        const layoutClasses = ["viewer-layout"];

        if (hasSidebar) {
          layoutClasses.push("has-sidebar");
        }

        if (hasSidebar && currentNavState.railCollapsed) {
          layoutClasses.push("is-sidebar-collapsed");
          railClasses.push("is-rail-collapsed");
        }

        const contentsHtml = buildNavSectionHtml(
          "Contents",
          "contents",
          tocItems.length
            ? '<ol class="toc-list">' + tocHtml + "</ol>"
            : '<p class="explorer-empty">No headings found in this document.</p>',
          {
            collapsed: currentNavState.contentsCollapsed,
            empty: !tocItems.length
          }
        );

        const leftNavHtml = hasSidebar
          ? '<aside class="' +
            railClasses.join(" ") +
            '">' +
            '<div class="preview-nav__header">' +
            '<span class="preview-nav__title">Navigation</span>' +
            '<button type="button" class="chrome-toggle" data-toggle-target="rail" aria-expanded="' +
            String(!currentNavState.railCollapsed) +
            '">' +
            '<span class="chrome-toggle__label">' +
            escapeAttribute(currentNavState.railCollapsed ? "Open" : "Collapse") +
            "</span>" +
            '<span class="chrome-toggle__icon" aria-hidden="true">' +
            escapeAttribute(currentNavState.railCollapsed ? "→" : "←") +
            "</span>" +
            "</button>" +
            "</div>" +
            explorerHtml +
            contentsHtml +
            "</aside>"
          : "";

        preview.innerHTML =
          '<div class="' +
          layoutClasses.join(" ") +
          '">' +
          leftNavHtml +
          '<div class="preview-layout">' +
          '<div class="preview-body reading-column">' +
          bodyHtml +
          "</div>" +
          "</div>" +
          "</div>";

        wirePreviewChromeInteractions(explorerContext);
      }

      function rerenderPreviewShell() {
        renderPreviewShell(currentPreviewBodyHtml, currentTocItems, currentExplorerContext);
      }

      function togglePreviewSection(target) {
        if (target === "rail") {
          currentNavState.railCollapsed = !currentNavState.railCollapsed;
        } else if (target === "repository") {
          currentNavState.repositoryCollapsed = !currentNavState.repositoryCollapsed;
        } else if (target === "contents") {
          currentNavState.contentsCollapsed = !currentNavState.contentsCollapsed;
        } else {
          return;
        }

        rerenderPreviewShell();
      }

      function wirePreviewChromeInteractions(explorerContext) {
        if (!currentExplorerContext && !currentHasToc) {
          return;
        }

        const toggles = preview.querySelectorAll("[data-toggle-target]");
        toggles.forEach((toggle) => {
          toggle.addEventListener("click", () => {
            const target = toggle.getAttribute("data-toggle-target");
            if (target) {
              togglePreviewSection(target);
            }
          });
        });

        wireExplorerInteractions(explorerContext);
      }

      function syncUrlState(url, options) {
        const next = new URL(window.location.href);
        next.searchParams.set("url", url);

        if (options && options.entry) {
          next.searchParams.set("entry", options.entry);
        } else {
          next.searchParams.delete("entry");
        }

        window.history.replaceState({}, "", next);
      }

      function decodeBase64Utf8(base64Value) {
        const cleaned = String(base64Value || "").replace(/\n/g, "");
        const binary = atob(cleaned);
        const bytes = Uint8Array.from(binary, (char) => char.charCodeAt(0));
        return new TextDecoder().decode(bytes);
      }

      async function fetchJson(url, allowNotFound) {
        const response = await fetch(url, {
          headers: {
            Accept: "application/vnd.github+json"
          }
        });

        if (allowNotFound && response.status === 404) {
          return null;
        }

        if (!response.ok) {
          let message = "HTTP " + response.status + " " + response.statusText;

          try {
            const errorData = await response.json();
            if (errorData && errorData.message) {
              message += ": " + errorData.message;
            }
          } catch (_error) {
            // Ignore JSON parsing errors for error bodies.
          }

          throw new Error(message);
        }

        return response.json();
      }

      function parseGitHubUrl(sourceUrl) {
        try {
          const parsed = new URL(sourceUrl);
          if (parsed.hostname !== "github.com" && parsed.hostname !== "www.github.com") {
            return null;
          }

          const segments = parsed.pathname.split("/").filter(Boolean).map((segment) => decodeURIComponent(segment));
          if (segments.length < 4) {
            return null;
          }

          const owner = segments[0];
          const repo = segments[1];
          const mode = segments[2];
          if (mode !== "tree" && mode !== "blob") {
            return null;
          }

          return {
            owner: owner,
            repo: repo,
            mode: mode,
            remainder: segments.slice(3)
          };
        } catch (_error) {
          return null;
        }
      }

      async function resolveGitHubRefAndPath(owner, repo, mode, remainder) {
        let lastError = null;

        for (let index = remainder.length; index >= 1; index -= 1) {
          const ref = remainder.slice(0, index).join("/");
          const path = remainder.slice(index).join("/");

          if (mode === "blob" && !path) {
            continue;
          }

          const apiUrl = buildGitHubApiUrl(owner, repo, path, ref);

          try {
            const payload = await fetchJson(apiUrl, true);
            if (!payload) {
              continue;
            }

            if (mode === "tree" && Array.isArray(payload)) {
              return {
                ref: ref,
                path: path,
                payload: payload
              };
            }

            if (mode === "blob" && !Array.isArray(payload) && payload.type === "file") {
              return {
                ref: ref,
                path: path,
                payload: payload
              };
            }
          } catch (error) {
            lastError = error;
          }
        }

        throw lastError || new Error("Unable to resolve the GitHub branch and path from this URL.");
      }

      async function fetchGitHubDirectory(owner, repo, ref, path) {
        const payload = await fetchJson(buildGitHubApiUrl(owner, repo, path, ref));
        if (!Array.isArray(payload)) {
          throw new Error("The GitHub API did not return a directory listing for this path.");
        }
        return sortGitHubEntries(payload);
      }

      async function fetchGitHubFile(owner, repo, ref, path) {
        const payload = await fetchJson(buildGitHubApiUrl(owner, repo, path, ref));
        if (Array.isArray(payload) || payload.type !== "file") {
          throw new Error("The requested GitHub path is not a file.");
        }
        return payload;
      }

      async function readGitHubFileText(fileData) {
        if (fileData.content && fileData.encoding === "base64") {
          return decodeBase64Utf8(fileData.content);
        }

        if (fileData.download_url) {
          const response = await fetch(fileData.download_url, {
            method: "GET",
            mode: "cors",
            credentials: "omit"
          });

          if (!response.ok) {
            throw new Error("HTTP " + response.status + " " + response.statusText);
          }

          return response.text();
        }

        throw new Error("This GitHub file could not be read as Markdown text.");
      }

      function pickDefaultGitHubFile(entries) {
        const preferredNames = ["README.md", "README.markdown", "README.mdown", "README.mkdn", "SKILL.md", "index.md"];

        for (const name of preferredNames) {
          const match = entries.find((entry) => entry.type === "file" && entry.name.toLowerCase() === name.toLowerCase());
          if (match) {
            return match;
          }
        }

        return entries.find((entry) => entry.type === "file" && isMarkdownFileName(entry.name)) || null;
      }

      async function renderMarkdownContent(markdown, sourceUrl, explorerContext) {
        window.__markdownSourceUrl = sourceUrl;
        currentTocItems = [];
        headingSlugCounts = new Map();
        const html = marked.parse(markdown, { renderer });
        const safeHtml = DOMPurify.sanitize(html);

        renderPreviewShell('<div class="markdown-body">' + safeHtml + "</div>", currentTocItems, explorerContext);
        await renderMermaidBlocks(preview);
        await renderGraphvizBlocks(preview);
      }

      function renderExplorerNotice(message, explorerContext) {
        renderPreviewShell(
          '<div class="markdown-body"><p class="placeholder">' + escapeAttribute(message) + "</p></div>",
          [],
          explorerContext
        );
      }

      function wireExplorerInteractions(explorerContext) {
        if (!explorerContext) {
          return;
        }

        const links = preview.querySelectorAll(".explorer-link");
        links.forEach((link) => {
          link.addEventListener("click", async () => {
            const entryType = link.getAttribute("data-entry-type");
            const entryPath = link.getAttribute("data-entry-path") || "";

            if (entryType === "dir") {
              await loadGitHubDirectoryView({
                owner: explorerContext.owner,
                repo: explorerContext.repo,
                ref: explorerContext.ref,
                directoryPath: entryPath
              });
              return;
            }

            if (isMarkdownFileName(entryPath)) {
              await loadGitHubDirectoryView({
                owner: explorerContext.owner,
                repo: explorerContext.repo,
                ref: explorerContext.ref,
                directoryPath: explorerContext.directoryPath,
                entries: explorerContext.entries,
                selectedPath: entryPath
              });
              return;
            }

            const nextContext = {
              owner: explorerContext.owner,
              repo: explorerContext.repo,
              ref: explorerContext.ref,
              directoryPath: explorerContext.directoryPath,
              directoryUrl: explorerContext.directoryUrl,
              entries: explorerContext.entries,
              selectedPath: entryPath
            };

            renderExplorerNotice("This file is not Markdown: " + entryPath, nextContext);
            setStatus("Browsing GitHub directory: " + explorerContext.owner + "/" + explorerContext.repo);
            syncUrlState(explorerContext.directoryUrl, { entry: entryPath });
          });
        });
      }

      async function loadGitHubDirectoryView(options) {
        const directoryPath = options.directoryPath || "";
        const entries = options.entries || (await fetchGitHubDirectory(options.owner, options.repo, options.ref, directoryPath));
        const directoryUrl = buildGitHubTreeUrl(options.owner, options.repo, options.ref, directoryPath);
        const requestedEntry = options.selectedPath || "";
        const selectedEntry =
          entries.find((entry) => entry.path === requestedEntry) ||
          pickDefaultGitHubFile(entries);

        const explorerContext = {
          owner: options.owner,
          repo: options.repo,
          ref: options.ref,
          directoryPath: directoryPath,
          directoryUrl: directoryUrl,
          entries: entries,
          selectedPath: selectedEntry ? selectedEntry.path : requestedEntry || null
        };

        if (selectedEntry && selectedEntry.type === "file" && isMarkdownFileName(selectedEntry.name)) {
          const file = await fetchGitHubFile(options.owner, options.repo, options.ref, selectedEntry.path);
          const markdown = await readGitHubFileText(file);
          await renderMarkdownContent(markdown, file.download_url || buildGitHubBlobUrl(options.owner, options.repo, options.ref, selectedEntry.path), explorerContext);
          setStatus("Rendered GitHub Markdown: " + selectedEntry.path);
          syncUrlState(directoryUrl, { entry: selectedEntry.path });
          return;
        }

        renderExplorerNotice("Select a Markdown file from this GitHub directory.", explorerContext);
        setStatus("Browsing GitHub directory: " + options.owner + "/" + options.repo);
        syncUrlState(directoryUrl);
      }

      async function loadGitHubBlobView(sourceUrl) {
        const parsed = parseGitHubUrl(sourceUrl);
        const resolved = await resolveGitHubRefAndPath(parsed.owner, parsed.repo, parsed.mode, parsed.remainder);
        const directoryPath = resolved.path.split("/").slice(0, -1).join("/");
        const entries = await fetchGitHubDirectory(parsed.owner, parsed.repo, resolved.ref, directoryPath);

        await loadGitHubDirectoryView({
          owner: parsed.owner,
          repo: parsed.repo,
          ref: resolved.ref,
          directoryPath: directoryPath,
          entries: entries,
          selectedPath: resolved.path
        });
      }

      async function loadGitHubTreeView(sourceUrl) {
        const parsed = parseGitHubUrl(sourceUrl);
        const resolved = await resolveGitHubRefAndPath(parsed.owner, parsed.repo, parsed.mode, parsed.remainder);
        const selectedEntryFromQuery = new URL(window.location.href).searchParams.get("entry");

        await loadGitHubDirectoryView({
          owner: parsed.owner,
          repo: parsed.repo,
          ref: resolved.ref,
          directoryPath: resolved.path,
          entries: resolved.payload,
          selectedPath: selectedEntryFromQuery
        });
      }

      async function getVizInstance() {
        if (!vizInstancePromise) {
          vizInstancePromise = Viz.instance();
        }
        return vizInstancePromise;
      }

      async function getMermaidApi() {
        if (!mermaidApiPromise) {
          mermaidApiPromise = import("./vendor/mermaid/mermaid.esm.mjs").then((module) => {
            const mermaid = module.default;
            mermaid.initialize({
              startOnLoad: false,
              securityLevel: "strict",
              theme: "default"
            });
            return mermaid;
          });
        }

        return mermaidApiPromise;
      }

      async function renderGraphvizBlocks(container) {
        const blocks = Array.from(container.querySelectorAll("pre code.language-dot, pre code.language-digraph"));
        if (!blocks.length) {
          return;
        }

        let viz;
        try {
          viz = await getVizInstance();
        } catch (error) {
          blocks.forEach((codeBlock) => {
            const host = codeBlock.closest("pre");
            if (!host) {
              return;
            }
            const failure = document.createElement("div");
            failure.className = "graphviz-error";
            failure.textContent = "Graphviz runtime failed to initialize: " + (error && error.message ? error.message : String(error));
            host.replaceWith(failure);
          });
          return;
        }

        for (const codeBlock of blocks) {
          const source = codeBlock.textContent || "";
          const host = codeBlock.closest("pre");
          if (!host) {
            continue;
          }

          try {
            const svg = viz.renderString(source, { format: "svg", engine: "dot" });
            const graph = document.createElement("div");
            graph.className = "graphviz-block";
            graph.innerHTML = DOMPurify.sanitize(svg, { USE_PROFILES: { svg: true, svgFilters: true } });
            host.replaceWith(graph);
          } catch (error) {
            const failure = document.createElement("div");
            failure.className = "graphviz-error";
            failure.textContent = "Graphviz render failed: " + (error && error.message ? error.message : String(error));
            host.replaceWith(failure);
          }
        }
      }

      async function renderMermaidBlocks(container) {
        const blocks = Array.from(container.querySelectorAll("pre code.language-mermaid"));
        if (!blocks.length) {
          return;
        }

        let mermaid;
        try {
          mermaid = await getMermaidApi();
        } catch (error) {
          blocks.forEach((codeBlock) => {
            const host = codeBlock.closest("pre");
            if (!host) {
              return;
            }
            const failure = document.createElement("div");
            failure.className = "mermaid-error";
            failure.textContent = "Mermaid runtime failed to initialize: " + (error && error.message ? error.message : String(error));
            host.replaceWith(failure);
          });
          return;
        }

        for (let index = 0; index < blocks.length; index += 1) {
          const codeBlock = blocks[index];
          const source = codeBlock.textContent || "";
          const host = codeBlock.closest("pre");
          if (!host) {
            continue;
          }

          try {
            const renderId = "mermaid-diagram-" + Date.now() + "-" + index;
            const renderResult = await mermaid.render(renderId, source);
            const graph = document.createElement("div");
            graph.className = "mermaid-block";
            graph.innerHTML = DOMPurify.sanitize(renderResult.svg, { USE_PROFILES: { svg: true, svgFilters: true } });
            host.replaceWith(graph);
          } catch (error) {
            const failure = document.createElement("div");
            failure.className = "mermaid-error";
            failure.textContent = "Mermaid render failed: " + (error && error.message ? error.message : String(error));
            host.replaceWith(failure);
          }
        }
      }

      renderer.link = function ({ href, title, tokens }) {
        const text = this.parser.parseInline(tokens);
        const safeHref = resolveUrl(href, window.__markdownSourceUrl || window.location.href);
        const titleAttr = title ? ' title="' + escapeAttribute(title) + '"' : "";
        return '<a href="' + safeHref + '"' + titleAttr + ' target="_blank" rel="noreferrer noopener">' + text + "</a>";
      };

      renderer.image = function ({ href, title, text }) {
        const safeHref = resolveUrl(href, window.__markdownSourceUrl || window.location.href);
        const titleAttr = title ? ' title="' + escapeAttribute(title) + '"' : "";
        return '<img src="' + safeHref + '" alt="' + escapeAttribute(text || "") + '"' + titleAttr + " />";
      };

      renderer.heading = function ({ tokens, depth }) {
        const text = this.parser.parseInline(tokens);
        const plainText = tokens.map((token) => token.raw || token.text || "").join("").trim();
        const id = slugify(plainText);

        currentTocItems.push({
          id: id,
          text: plainText || "Untitled",
          depth: Math.min(Math.max(depth, 1), 6)
        });

        return (
          "<h" +
          depth +
          ' id="' +
          escapeAttribute(id) +
          '">' +
          '<a class="heading-anchor" href="#' +
          escapeAttribute(id) +
          '">' +
          text +
          "</a>" +
          "</h" +
          depth +
          ">"
        );
      };

      function setStatus(message) {
        statusBox.textContent = message;
      }

      function clearError() {
        errorBox.style.display = "none";
        errorBox.textContent = "";
      }

      function setError(message) {
        errorBox.style.display = "block";
        errorBox.textContent = message;
      }

      function setPlaceholder(message) {
        preview.innerHTML = "";
        const paragraph = document.createElement("p");
        paragraph.className = "placeholder";
        paragraph.textContent = message;
        preview.appendChild(paragraph);
        currentExplorerContext = null;
        currentHasToc = false;
      }

      async function loadSource(sourceUrl) {
        clearError();
        setStatus("Loading source...");
        setPlaceholder("Loading preview...");

        try {
          const githubUrl = parseGitHubUrl(sourceUrl);

          if (githubUrl && githubUrl.mode === "tree") {
            await loadGitHubTreeView(sourceUrl);
            return;
          }

          if (githubUrl && githubUrl.mode === "blob") {
            await loadGitHubBlobView(sourceUrl);
            return;
          }

          const response = await fetch(sourceUrl, {
            method: "GET",
            mode: "cors",
            credentials: "omit"
          });

          if (!response.ok) {
            throw new Error("HTTP " + response.status + " " + response.statusText);
          }

          const markdown = await response.text();
          await renderMarkdownContent(markdown, sourceUrl, null);
          setStatus("Rendered successfully: " + sourceUrl);
          syncUrlState(sourceUrl);
        } catch (error) {
          const detail =
            "Failed to load: " +
            sourceUrl +
            "\n\nPossible reasons:\n" +
            "1. The target URL does not allow CORS requests\n" +
            "2. The target content is not publicly accessible\n" +
            "3. The GitHub API rate limit or URL structure prevented directory lookup\n" +
            "4. There is a network or TLS issue\n\n" +
            "Browser error: " +
            (error && error.message ? error.message : String(error));

          setError(detail);
          setStatus("Render failed.");
          setPlaceholder("This URL cannot be previewed right now.");
        }
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const url = input.value.trim();

        if (!url) {
          setStatus("Enter a URL first.");
          setPlaceholder("The rendered Markdown preview will appear here.");
          clearError();
          return;
        }

        await loadSource(url);
      });

      const params = new URLSearchParams(window.location.search);
      const initialUrl = params.get("url");
      if (initialUrl) {
        input.value = initialUrl;
        loadSource(initialUrl);
      }
    </script>
  </body>
</html>
