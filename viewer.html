<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Markdown URL Viewer</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f0e8;
        --panel: rgba(255, 251, 245, 0.92);
        --panel-strong: #fffaf2;
        --text: #1f1a17;
        --muted: #675f58;
        --accent: #0d6b5f;
        --accent-strong: #094e45;
        --border: rgba(31, 26, 23, 0.12);
        --error-bg: #fff1eb;
        --error-text: #8a3318;
        --shadow: 0 20px 50px rgba(40, 30, 20, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Georgia, "Times New Roman", serif;
        color: var(--text);
        background:
          radial-gradient(circle at top left, rgba(13, 107, 95, 0.14), transparent 34%),
          radial-gradient(circle at top right, rgba(177, 112, 51, 0.12), transparent 28%),
          linear-gradient(180deg, #f7f4ed 0%, var(--bg) 100%);
      }

      .shell {
        width: min(980px, calc(100% - 32px));
        margin: 32px auto;
        padding: 24px;
        border: 1px solid var(--border);
        border-radius: 24px;
        background: var(--panel);
        box-shadow: var(--shadow);
        backdrop-filter: blur(14px);
      }

      h1 {
        margin: 0 0 8px;
        font-size: clamp(2rem, 3vw, 2.8rem);
        line-height: 1.02;
        letter-spacing: -0.03em;
      }

      .intro {
        margin: 0 0 20px;
        color: var(--muted);
        font-size: 1rem;
      }

      .form {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 12px;
        align-items: stretch;
        margin-bottom: 12px;
      }

      input[type="url"] {
        width: 100%;
        padding: 14px 16px;
        border: 1px solid var(--border);
        border-radius: 14px;
        font: inherit;
        font-size: 1rem;
        color: var(--text);
        background: rgba(255, 255, 255, 0.9);
      }

      input[type="url"]:focus {
        outline: 2px solid rgba(13, 107, 95, 0.18);
        border-color: rgba(13, 107, 95, 0.45);
      }

      button {
        border: 0;
        border-radius: 14px;
        padding: 0 18px;
        min-height: 52px;
        font: inherit;
        font-weight: 600;
        color: #fff9f1;
        background: linear-gradient(135deg, var(--accent) 0%, var(--accent-strong) 100%);
        cursor: pointer;
      }

      button:hover {
        filter: brightness(1.02);
      }

      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 10px 16px;
        margin-bottom: 18px;
        color: var(--muted);
        font-size: 0.95rem;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.6);
      }

      .status,
      .error {
        margin-bottom: 18px;
        padding: 14px 16px;
        border-radius: 14px;
      }

      .status {
        border: 1px solid rgba(13, 107, 95, 0.18);
        background: rgba(13, 107, 95, 0.08);
        color: var(--accent-strong);
      }

      .error {
        display: none;
        border: 1px solid rgba(138, 51, 24, 0.18);
        background: var(--error-bg);
        color: var(--error-text);
        white-space: pre-wrap;
      }

      .preview {
        padding: clamp(20px, 4vw, 40px);
        border: 1px solid var(--border);
        border-radius: 20px;
        background: var(--panel-strong);
      }

      .preview-layout {
        display: grid;
        grid-template-columns: minmax(0, 230px) minmax(0, 1fr);
        gap: 24px;
        align-items: start;
      }

      .toc {
        position: sticky;
        top: 18px;
        padding: 16px;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: rgba(247, 244, 237, 0.95);
      }

      .toc.is-empty {
        display: none;
      }

      .toc h2 {
        margin: 0 0 12px;
        font-size: 0.95rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .toc-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 6px;
      }

      .toc-item {
        margin: 0;
      }

      .toc-link {
        display: block;
        color: var(--muted);
        text-decoration: none;
        line-height: 1.35;
        font-size: 0.95rem;
      }

      .toc-link:hover {
        color: var(--accent-strong);
      }

      .toc-link.depth-2 {
        padding-left: 12px;
      }

      .toc-link.depth-3 {
        padding-left: 24px;
      }

      .toc-link.depth-4,
      .toc-link.depth-5,
      .toc-link.depth-6 {
        padding-left: 36px;
      }

      .preview-body {
        min-width: 0;
      }

      .placeholder {
        margin: 0;
        color: var(--muted);
      }

      .markdown-body {
        line-height: 1.7;
        word-break: break-word;
      }

      .markdown-body > :first-child {
        margin-top: 0;
      }

      .markdown-body > :last-child {
        margin-bottom: 0;
      }

      .markdown-body h1,
      .markdown-body h2,
      .markdown-body h3 {
        line-height: 1.15;
        letter-spacing: -0.02em;
      }

      .heading-anchor {
        color: inherit;
        text-decoration: none;
      }

      .heading-anchor:hover {
        color: var(--accent-strong);
      }

      .markdown-body img {
        max-width: 100%;
      }

      .markdown-body pre {
        overflow-x: auto;
        padding: 14px 16px;
        border-radius: 14px;
        background: #f4efe5;
      }

      .markdown-body code {
        font-family: "Cascadia Code", Consolas, monospace;
        font-size: 0.94em;
      }

      .markdown-body blockquote {
        margin-left: 0;
        padding-left: 16px;
        border-left: 4px solid rgba(13, 107, 95, 0.3);
        color: var(--muted);
      }

      .graphviz-block {
        margin: 24px 0;
        padding: 16px;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: #f7f3ea;
        overflow-x: auto;
      }

      .graphviz-block svg {
        display: block;
        max-width: 100%;
        height: auto;
      }

      .graphviz-error {
        margin: 24px 0;
        padding: 14px 16px;
        border: 1px solid rgba(138, 51, 24, 0.18);
        border-radius: 16px;
        background: var(--error-bg);
        color: var(--error-text);
      }

      @media (max-width: 680px) {
        .shell {
          width: min(100% - 20px, 980px);
          margin: 10px auto;
          padding: 16px;
          border-radius: 18px;
        }

        .form {
          grid-template-columns: 1fr;
        }

        button {
          width: 100%;
        }

        .preview-layout {
          grid-template-columns: 1fr;
        }

        .toc {
          position: static;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <h1>Markdown URL Viewer</h1>
      <p class="intro">
        Enter a public URL that returns Markdown text. This page will fetch it in the browser and render a preview.
      </p>

      <form id="viewer-form" class="form">
        <input
          id="url-input"
          name="url"
          type="url"
          placeholder="https://example.com/file.md"
          required
        />
        <button type="submit">Render Preview</button>
      </form>

      <div class="meta">
        <span class="chip">Query param: <code>?url=...</code></span>
        <span class="chip">Target URL must allow browser CORS requests</span>
      </div>

      <section id="status" class="status">Waiting for a URL.</section>
      <section id="error" class="error"></section>
      <article id="preview" class="preview">
        <p class="placeholder">The rendered Markdown preview will appear here.</p>
      </article>
    </main>

    <script src="./vendor/purify.min.js"></script>
    <script src="./vendor/marked.min.js"></script>
    <script src="./vendor/viz-global.js"></script>
    <script>
      const form = document.getElementById("viewer-form");
      const input = document.getElementById("url-input");
      const statusBox = document.getElementById("status");
      const errorBox = document.getElementById("error");
      const preview = document.getElementById("preview");
      let currentTocItems = [];
      let headingSlugCounts = new Map();
      let vizInstancePromise = null;

      marked.setOptions({
        gfm: true,
        breaks: false
      });

      const renderer = new marked.Renderer();

      function resolveUrl(href, sourceUrl) {
        if (!href) {
          return href;
        }

        try {
          return new URL(href, sourceUrl).toString();
        } catch (_error) {
          return href;
        }
      }

      function escapeAttribute(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/"/g, "&quot;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }

      function slugify(text) {
        const base = String(text || "")
          .toLowerCase()
          .trim()
          .replace(/<[^>]*>/g, "")
          .replace(/[^\w\u4e00-\u9fff\s-]/g, "")
          .replace(/\s+/g, "-")
          .replace(/-+/g, "-")
          .replace(/^-|-$/g, "") || "section";

        const count = headingSlugCounts.get(base) || 0;
        headingSlugCounts.set(base, count + 1);
        return count === 0 ? base : base + "-" + (count + 1);
      }

      function buildTocHtml(items) {
        if (!items.length) {
          return "";
        }

        return items
          .map((item) => {
            return (
              '<li class="toc-item">' +
              '<a class="toc-link depth-' +
              item.depth +
              '" href="#' +
              escapeAttribute(item.id) +
              '">' +
              escapeAttribute(item.text) +
              "</a>" +
              "</li>"
            );
          })
          .join("");
      }

      function renderPreviewShell(bodyHtml, tocItems) {
        const tocHtml = buildTocHtml(tocItems);
        preview.innerHTML =
          '<div class="preview-layout">' +
          '<aside class="toc' +
          (tocItems.length ? "" : " is-empty") +
          '">' +
          "<h2>Contents</h2>" +
          '<ol class="toc-list">' +
          tocHtml +
          "</ol>" +
          "</aside>" +
          '<div class="preview-body">' +
          bodyHtml +
          "</div>" +
          "</div>";
      }

      async function getVizInstance() {
        if (!vizInstancePromise) {
          vizInstancePromise = Viz.instance();
        }
        return vizInstancePromise;
      }

      async function renderGraphvizBlocks(container) {
        const blocks = Array.from(container.querySelectorAll("pre code.language-dot, pre code.language-digraph"));
        if (!blocks.length) {
          return;
        }

        let viz;
        try {
          viz = await getVizInstance();
        } catch (error) {
          blocks.forEach((codeBlock) => {
            const host = codeBlock.closest("pre");
            if (!host) {
              return;
            }
            const failure = document.createElement("div");
            failure.className = "graphviz-error";
            failure.textContent = "Graphviz runtime failed to initialize: " + (error && error.message ? error.message : String(error));
            host.replaceWith(failure);
          });
          return;
        }

        for (const codeBlock of blocks) {
          const source = codeBlock.textContent || "";
          const host = codeBlock.closest("pre");
          if (!host) {
            continue;
          }

          try {
            const svg = viz.renderString(source, { format: "svg", engine: "dot" });
            const graph = document.createElement("div");
            graph.className = "graphviz-block";
            graph.innerHTML = DOMPurify.sanitize(svg, { USE_PROFILES: { svg: true, svgFilters: true } });
            host.replaceWith(graph);
          } catch (error) {
            const failure = document.createElement("div");
            failure.className = "graphviz-error";
            failure.textContent = "Graphviz render failed: " + (error && error.message ? error.message : String(error));
            host.replaceWith(failure);
          }
        }
      }

      renderer.link = function ({ href, title, tokens }) {
        const text = this.parser.parseInline(tokens);
        const safeHref = resolveUrl(href, window.__markdownSourceUrl || window.location.href);
        const titleAttr = title ? ' title="' + escapeAttribute(title) + '"' : "";
        return '<a href="' + safeHref + '"' + titleAttr + ' target="_blank" rel="noreferrer noopener">' + text + "</a>";
      };

      renderer.image = function ({ href, title, text }) {
        const safeHref = resolveUrl(href, window.__markdownSourceUrl || window.location.href);
        const titleAttr = title ? ' title="' + escapeAttribute(title) + '"' : "";
        return '<img src="' + safeHref + '" alt="' + escapeAttribute(text || "") + '"' + titleAttr + " />";
      };

      renderer.heading = function ({ tokens, depth }) {
        const text = this.parser.parseInline(tokens);
        const plainText = tokens.map((token) => token.raw || token.text || "").join("").trim();
        const id = slugify(plainText);

        currentTocItems.push({
          id: id,
          text: plainText || "Untitled",
          depth: Math.min(Math.max(depth, 1), 6)
        });

        return (
          "<h" +
          depth +
          ' id="' +
          escapeAttribute(id) +
          '">' +
          '<a class="heading-anchor" href="#' +
          escapeAttribute(id) +
          '">' +
          text +
          "</a>" +
          "</h" +
          depth +
          ">"
        );
      };

      function setStatus(message) {
        statusBox.textContent = message;
      }

      function clearError() {
        errorBox.style.display = "none";
        errorBox.textContent = "";
      }

      function setError(message) {
        errorBox.style.display = "block";
        errorBox.textContent = message;
      }

      function setPlaceholder(message) {
        preview.innerHTML = "";
        const paragraph = document.createElement("p");
        paragraph.className = "placeholder";
        paragraph.textContent = message;
        preview.appendChild(paragraph);
      }

      function syncUrlQuery(url) {
        const next = new URL(window.location.href);
        next.searchParams.set("url", url);
        window.history.replaceState({}, "", next);
      }

      async function loadMarkdown(sourceUrl) {
        clearError();
        setStatus("Fetching remote Markdown...");
        setPlaceholder("Loading preview...");

        try {
          const response = await fetch(sourceUrl, {
            method: "GET",
            mode: "cors",
            credentials: "omit"
          });

          if (!response.ok) {
            throw new Error("HTTP " + response.status + " " + response.statusText);
          }

          const markdown = await response.text();
          window.__markdownSourceUrl = sourceUrl;
          currentTocItems = [];
          headingSlugCounts = new Map();
          const html = marked.parse(markdown, { renderer });
          const safeHtml = DOMPurify.sanitize(html);

          renderPreviewShell('<div class="markdown-body">' + safeHtml + "</div>", currentTocItems);
          await renderGraphvizBlocks(preview);
          setStatus("Rendered successfully: " + sourceUrl);
          syncUrlQuery(sourceUrl);
        } catch (error) {
          const detail =
            "Failed to load: " +
            sourceUrl +
            "\n\nPossible reasons:\n" +
            "1. The target URL does not allow CORS requests\n" +
            "2. The target content is not publicly accessible\n" +
            "3. There is a network or TLS issue\n\n" +
            "Browser error: " +
            (error && error.message ? error.message : String(error));

          setError(detail);
          setStatus("Render failed.");
          setPlaceholder("This URL cannot be previewed right now.");
        }
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const url = input.value.trim();

        if (!url) {
          setStatus("Enter a URL first.");
          setPlaceholder("The rendered Markdown preview will appear here.");
          clearError();
          return;
        }

        await loadMarkdown(url);
      });

      const params = new URLSearchParams(window.location.search);
      const initialUrl = params.get("url");
      if (initialUrl) {
        input.value = initialUrl;
        loadMarkdown(initialUrl);
      }
    </script>
  </body>
</html>
